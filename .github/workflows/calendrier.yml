name: Calendrier escrime

on:
  schedule:
    - cron: "52 6 * * *"   # chaque jour à 6 h 52 UTC (7 h 52 en France en hiver, 8 h 52 en été)
  workflow_dispatch:       # bouton « Run workflow » pour régénérer à la demande
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write   # mise à jour des copies de secours dans data/sources
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Générer la page
        run: python scripts/build_calendar.py --out dist/index.html

      - name: Enregistrer les sources téléchargées (copies de secours)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sources
          if ! git diff --cached --quiet; then
            git commit -m "Mise à jour des sources du calendrier"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
