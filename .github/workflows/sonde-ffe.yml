name: Sonde FFE (temporaire)
on:
  pull_request:
    paths: [".github/workflows/sonde-ffe.yml"]
jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL -A "Mozilla/5.0" -o p.html https://www.ffescrime.fr/calendrier/
          python3 - <<'PY'
          import re,base64,urllib.request
          h=open("p.html",encoding="utf-8").read()
          i=h.find("MÉRIGNAC")
          m=re.findall(r'/competition/([A-Za-z0-9+/=]+)',h[i-300:i+300])[0]
          print("id",m,"->",base64.b64decode(m).decode())
          req=urllib.request.Request("https://www.ffescrime.fr/competition/"+m,headers={"User-Agent":"Mozilla/5.0"})
          d=urllib.request.urlopen(req).read().decode()
          print("taille detail",len(d))
          def clean(s): return re.sub(r"[ \t]+"," ",re.sub(r"\n\s*\n+","\n",s))
          print("=== liens pdf/documents ===")
          for x in sorted(set(re.findall(r'href="([^"]*(?:\.pdf|upload|document|organisation|roadmap|feuille)[^"]*)"',d,re.I))): print(x)
          k=d.find("MÉRIGNAC"); k=k if k>=0 else d.lower().find("rignac")
          print("idx",k)
          def tx(x): return clean(re.sub(r"<[^>]+>"," ",re.sub(r"<script.*?</script>|<style.*?</style>","",x,flags=re.S)))
          print("=== contenu principal (texte) ===")
          print(tx(d[max(0,k-1500):k+6000])[:3500])
          print("=== liens/boutons dans le bloc ===")
          for x in re.findall(r'<a [^>]*href="([^"]+)"[^>]*>(.*?)</a>',d[max(0,k-1500):k+8000],re.S): print(x[0][:150],"|",tx(x[1])[:60])
          print("=== scripts ajax/data ===")
          for x in re.findall(r"(?:fetch|ajax|url)[^;\n]{0,120}(?:competition|document|fichier|note)[^;\n]{0,80}",d,re.I)[:10]: print(x)
          PY
